receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

extensions:
  sigv4auth:
    region: us-east-2
    service: aps

exporters:
  awsxray:
    region: us-east-2
  prometheusremotewrite:
    # Replace with the "Remote write endpoint" from your AMP workspace details page.
    endpoint: https://aps-workspaces.us-east-2.amazonaws.com/workspaces/REPLACE_WITH_WORKSPACE_ID/api/v1/remote_write
    auth:
      authenticator: sigv4auth
  logging:
    loglevel: debug

service:
  extensions: [sigv4auth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite, logging]
